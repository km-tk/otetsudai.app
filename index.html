<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お手伝いお小遣いノート - 申請</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("YOUR_PUBLIC_KEY");
   })();
</script>
<style>
  body { font-family: sans-serif; background: #f4f7f6; padding: 15px; margin: 0; color: #333; }
  .container { max-width: 600px; margin: 0 auto; }
  .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #4a4a4a; font-size: 20px; margin-bottom: 20px; }
  h2 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 6px; color: #2c3e50; }
  label { font-size: 12px; color: #666; display: block; margin-top: 10px; font-weight: bold; }
  input, select { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .btn { width: 100%; padding: 12px; border: none; background: #4CAF50; color: white; font-weight: bold; font-size: 16px; border-radius: 8px; margin-top: 15px; cursor: pointer; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
  .btn-nav { background: #ff9800; }
  .btn-approve { background: #2196F3; width: auto; padding: 6px 12px; margin: 0; font-size: 12px; }
  .request-item { background: #fff8e1; padding: 12px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-left: 4px solid #ffb74d; }
  .flex-group { display: flex; gap: 10px; }
  .flex-group > div { flex: 1; }
</style>
</head>
<body>

<div class="container">
  <h1>お手伝いお小遣いノート</h1>

  <a href="calendar.html" class="btn btn-nav">📅 承認済み確認・カレンダーを見る</a>

  <div class="card" style="margin-top: 15px;">
    <h2>1. 基本設定（親）</h2>
    <label>通知先メールアドレス</label>
    <div class="flex-group">
      <div><input type="email" id="fatherEmail" value="father@example.com" placeholder="父メール"></div>
      <div><input type="email" id="motherEmail" value="mother@example.com" placeholder="母メール"></div>
    </div>
    
    <label>お小遣い基本設定（1回あたりの単価）</label>
    <div class="flex-group">
      <div>
        <label style="font-weight:normal;">お兄ちゃん基本額</label>
        <input type="number" id="oniBaseRate" value="20">
      </div>
      <div>
        <label style="font-weight:normal;">妹ちゃん基本額</label>
        <input type="number" id="imoutoBaseRate" value="20">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. お手伝い申請（子供）</h2>
    
    <label>お手伝いをした日付</label>
    <input type="date" id="taskDate">

    <label>だれが？</label>
    <select id="childSelect">
      <option value="お兄ちゃん">お兄ちゃん</option>
      <option value="妹ちゃん">妹ちゃん</option>
    </select>

    <label>お手伝いのメモ（任意）</label>
    <input type="text" id="taskMemoInput" placeholder="例：お皿洗いなど">

    <label>特別調整金額（基本額と違う場合のみ入力）</label>
    <input type="number" id="customAmount" placeholder="空欄の場合は基本額が適用されます">

    <button class="btn" onclick="sendRequest()">父母へ申請メールを送る</button>
  </div>

  <div class="card">
    <h2>3. 承認待ちリスト（親エリア）</h2>
    <div id="requestList"></div>
  </div>
</div>

<script>
  document.getElementById('taskDate').valueAsDate = new Date();

  function sendRequest() {
    const date = document.getElementById('taskDate').value;
    const child = document.getElementById('childSelect').value;
    const memo = document.getElementById('taskMemoInput').value || "手伝い";
    const customAmount = document.getElementById('customAmount').value;

    if (!date) {
      alert("日付を選択してください。");
      return;
    }

    const pendingList = JSON.parse(localStorage.getItem('pendingList') || '[]');
    const approvedList = JSON.parse(localStorage.getItem('approvedList') || '[]');
    
    const countToday = [...pendingList, ...approvedList].filter(item => item.date === date && item.child === child).length;

    if (countToday >= 3) {
      alert(`${child}の${date}の申請はすでに上限の3回に達しています。`);
      return;
    }

    const taskLabel = `手伝い${["①", "②", "③"][countToday]}`;

    let baseRate = 0;
    if (child === "お兄ちゃん") {
      baseRate = parseInt(document.getElementById('oniBaseRate').value) || 0;
    } else {
      baseRate = parseInt(document.getElementById('imoutoBaseRate').value) || 0;
    }
    const amount = customAmount ? parseInt(customAmount) : baseRate;

    const newItem = {
      id: Date.now(),
      date: date,
      child: child,
      label: taskLabel,
      memo: memo,
      amount: amount
    };

    pendingList.push(newItem);
    localStorage.setItem('pendingList', JSON.stringify(pendingList));

    renderPendingList();

    document.getElementById('customAmount').value = '';
    document.getElementById('taskMemoInput').value = '';
    
    alert(`【申請完了】\n${child}の「${taskLabel}（${amount}円）」を申請しました。`);
  }

  function renderPendingList() {
    const list = document.getElementById('requestList');
    list.innerHTML = '';
    const pendingList = JSON.parse(localStorage.getItem('pendingList') || '[]');

    pendingList.forEach(item => {
      const el = document.createElement('div');
      el.className = 'request-item';
      el.innerHTML = `
        <div>
          <b>[${item.date}] ${item.child}</b> - ${item.label}<br>
          <small>${item.memo}</small> (${item.amount}円)
        </div>
        <button class="btn btn-approve" onclick="approveItem(${item.id})">承認する</button>
      `;
      list.appendChild(el);
    });
  }

  function approveItem(id) {
    let pendingList = JSON.parse(localStorage.getItem('pendingList') || '[]');
    let approvedList = JSON.parse(localStorage.getItem('approvedList') || '[]');

    const targetIndex = pendingList.findIndex(item => item.id === id);
    if (targetIndex !== -1) {
      const targetItem = pendingList.splice(targetIndex, 1)[0];
      approvedList.push(targetItem);

      localStorage.setItem('pendingList', JSON.stringify(pendingList));
      localStorage.setItem('approvedList', JSON.stringify(approvedList));

      renderPendingList();
      alert("承認しました！リストから削除され、カレンダーに記録されました。");
    }
  }

  renderPendingList();
</script>

</body>
</html>
